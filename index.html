<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="Plundr — pirate swipe nonsense with one very bad siren problem." />
  <title>Plundr</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚓</text></svg>" />
</head>
<body>
  <main class="app-shell" aria-label="Plundr swipe demo">
    <div class="app-backdrop" aria-hidden="true">
      <span class="sea sea-1"></span>
      <span class="sea sea-2"></span>
      <span class="sea sea-3"></span>
      <span class="rope rope-1"></span>
      <span class="rope rope-2"></span>
    </div>

    <section class="deck-wrap">
      <div class="card-deck" id="card-deck" aria-label="Profile cards"></div>
    </section>

    <div class="action-row" role="group" aria-label="Swipe actions">
      <button class="action-btn action-btn-port" id="btn-port" type="button" aria-label="Pass">
        <span>✕</span>
      </button>
      <button class="action-btn action-btn-reset" id="btn-restart" type="button" aria-label="Reshuffle">
        <span>↻</span>
      </button>
      <button class="action-btn action-btn-starboard" id="btn-starboard" type="button" aria-label="Like">
        <span>⚓</span>
      </button>
    </div>

    <div class="toast hidden" id="toast" role="status" aria-live="polite"></div>
  </main>

  <script src="js/profiles.js"></script>
  <script src="js/swipe.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
